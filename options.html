<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Options</title>
  <style>
    body { font-family: -apple-system, Roboto, sans-serif; padding: 20px; background: #f5f5f7; }
    .box { background: white; padding: 18px; border-radius: 12px; max-width: 380px; margin: auto; }
    label { font-weight: 600; display: block; margin-bottom: 8px; }
    input[type="range"] { width: 100%; accent-color: #007aff; }
    button { width: 100%; padding: 12px; background: #007aff; color: #fff; border: 0; border-radius: 8px; margin-top: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <label>Seek Duration: <span id="v">10</span>s</label>
    <input type="range" id="s" min="3" max="30" step="1" value="10">
    <button id="b">Save</button>
  </div>
  <script src="options.js"></script>
</body>
</html>
